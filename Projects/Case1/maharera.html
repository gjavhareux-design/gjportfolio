<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work in Progress</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: Top;
            margin-top: 50px;
            min-height: 80vh;
            background-color: #020205; /* Deep space dark background */
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #ffffff;
            text-align: center;
            overflow: hidden; /* Prevents scrollbars from the galaxy animation */
        }

        /* Positions the galaxy animation fixed behind everything */
        #threejs-container {
            position: fixed;/
            top: 140px;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; 
        }

        /* Styled as a glass card to stand out against the stars 
        .wip-container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 1;
        }*/

        img {
            width: 100%;
            max-width: 400px;
            height: auto;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 35px;
            color: #c4c7c9;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            background-color: #d3bbff; /* Matches your portfolio's nebula purple */
            color: #040012;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: #ebdcff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div id="threejs-container"></div>
    <script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
    <script>
        (function() {
            const container = document.getElementById('threejs-container');
            const width = window.innerWidth;
            const height = window.innerHeight;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.z = 5;

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const parameters = {
                count: 50000,
                size: 0.015,
                radius: 5,
                branches: 3,
                spin: 1,
                randomness: 0.2,
                randomnessPower: 3,
                insideColor: '#4C1D95', 
                outsideColor: '#1E3A8A'  
            };

            let geometry = null;
            let material = null;
            let points = null;

            const generateGalaxy = () => {
                geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(parameters.count * 3);
                const colors = new Float32Array(parameters.count * 3);

                const colorInside = new THREE.Color(parameters.insideColor);
                const colorOutside = new THREE.Color(parameters.outsideColor);

                for(let i = 0; i < parameters.count; i++) {
                    const i3 = i * 3;
                    const radius = Math.random() * parameters.radius;
                    const spinAngle = radius * parameters.spin;
                    const branchAngle = (i % parameters.branches) / parameters.branches * Math.PI * 2;

                    const randomX = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
                    const randomY = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
                    const randomZ = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;

                    positions[i3 + 0] = Math.cos(branchAngle + spinAngle) * radius + randomX;
                    positions[i3 + 1] = randomY;
                    positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                    const mixedColor = colorInside.clone();
                    mixedColor.lerp(colorOutside, radius / parameters.radius);

                    colors[i3 + 0] = mixedColor.r;
                    colors[i3 + 1] = mixedColor.g;
                    colors[i3 + 2] = mixedColor.b;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                material = new THREE.PointsMaterial({
                    size: parameters.size,
                    sizeAttenuation: true,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending,
                    vertexColors: true
                });

                points = new THREE.Points(geometry, material);
                scene.add(points);
            };

            generateGalaxy();

            const mouse = { x: 0, y: 0 };
            window.addEventListener('mousemove', (event) => {
                mouse.x = (event.clientX / window.innerWidth) - 0.5;
                mouse.y = (event.clientY / window.innerHeight) - 0.5;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            const clock = new THREE.Clock();

            const animate = () => {
                const elapsedTime = clock.getElapsedTime();
                points.rotation.y = elapsedTime * 0.1;
                camera.position.x += (mouse.x * 2 - camera.position.x) * 0.05;
                camera.position.y += (-mouse.y * 2 - camera.position.y) * 0.05;
                camera.lookAt(scene.position);
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            };

            animate();
        })();
    </script>

    <div class="wip-container">
        
        <img src="https://raw.githubusercontent.com/gjavhareux-design/gjportfolio/main/Projects/Case1/wip.gif" alt="Work in Progress Desk">

        <h1>Work in Progress</h1>
        <p>I am currently updating this section. Please check back later to see the finished project!</p>

        <a href="https://www.gjuxdesign.in/" class="btn">Go back to Portfolio</a>
    </div>

</body>
</html>
